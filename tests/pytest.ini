[pytest]
markers =
    testing: Isolate tests to either check specific funtions or tweak the test code without running the entire module.
    baseline_removal: Mark a test as part of the baseline_removal module. Its functions filter out noise from input specrta.
    calibration: Mark a test as part of the calibration module. Its functions compensate for error caused by system response.
    cosmic_ray: Mark a test as part of the cosmic_ray module. Its functions remove cosmic ray spikes from input spectra.
    datatypes: Mark a test as part of the datatypes module. Its functions convert data between different formats.
    file_io: Mark a test as part of the file_io module. Its functions handle provide file handling for the ORPL gui.
    metrics: Mark a test as part of the metrics module. Its functions measure the quality of the input data.
    normalization: Mark a test as part of the normalization module. Its functions scales specrta to utilize the entire dynamic range of the graph.

timeout = 60